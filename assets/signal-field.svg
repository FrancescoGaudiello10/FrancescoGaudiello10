<svg width="1280" height="190" viewBox="0 0 1280 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Data, context, and action</title>
  <desc id="description">An abstract technical diagram built from equations, code symbols, and data paths.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D1A"/>
      <stop offset=".5" stop-color="#1D1640"/>
      <stop offset="1" stop-color="#062C42"/>
    </linearGradient>
    <linearGradient id="path" x1="88" y1="80" x2="1190" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset=".46" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#C4B5FD" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1280" height="190" rx="18" fill="url(#background)"/>
  <rect width="1280" height="190" rx="18" fill="url(#grid)"/>

  <g opacity=".63" stroke="url(#path)" stroke-width="1.5">
    <path d="M71 135H229L287 83H438L502 129H665L738 63H915L993 112H1208"/>
    <path d="M146 48L222 76L300 42L377 71L472 39"/>
    <path d="M813 149L881 127L949 152L1031 133L1116 159"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="229" cy="135" r="4" fill="#67E8F9"/>
    <circle cx="287" cy="83" r="5" fill="#C4B5FD"/>
    <circle cx="502" cy="129" r="4" fill="#67E8F9"/>
    <circle cx="738" cy="63" r="5" fill="#E9D5FF"/>
    <circle cx="993" cy="112" r="4" fill="#67E8F9"/>
    <circle cx="222" cy="76" r="3" fill="#A78BFA"/>
    <circle cx="377" cy="71" r="3" fill="#A78BFA"/>
    <circle cx="881" cy="127" r="3" fill="#A78BFA"/>
    <circle cx="1031" cy="133" r="3" fill="#A78BFA"/>
  </g>

  <g font-family="monospace" font-weight="700">
    <text x="55" y="35" fill="#A5B4FC" fill-opacity=".58" font-size="12">signal / noise -&gt; clarity</text>
    <text x="61" y="169" fill="#67E8F9" fill-opacity=".62" font-size="12">d(value) / d(friction) &lt; 0</text>
    <text x="525" y="35" fill="#E9D5FF" fill-opacity=".62" font-size="12">input -&gt; system -&gt; outcome</text>
    <text x="991" y="37" fill="#A5F3FC" fill-opacity=".58" font-size="12">entropy(data) down</text>
    <text x="1050" y="174" fill="#C4B5FD" fill-opacity=".64" font-size="12">ship &gt; perfect</text>
  </g>

  <rect x="459" y="61" width="362" height="67" rx="12" fill="#0A1024" fill-opacity=".78" stroke="#A78BFA" stroke-opacity=".36"/>
  <text x="490" y="91" fill="#F5F3FF" font-family="monospace" font-size="17" font-weight="700">SUM(signal_i * context_i)</text>
  <text x="551" y="113" fill="#67E8F9" font-family="monospace" font-size="13" font-weight="700">=&gt; useful action</text>
</svg>
