<svg width="1280" height="170" viewBox="0 0 1280 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Signal field</title>
  <desc id="description">An abstract technology-inspired field of code, data, and glowing nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset=".48" stop-color="#21154A"/>
      <stop offset="1" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="line" x1="208" y1="30" x2="1071" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#C4B5FD" fill-opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1280" height="170" rx="18" fill="url(#background)"/>
  <rect width="1280" height="170" rx="18" fill="url(#dots)"/>
  <g opacity=".64" stroke="url(#line)" stroke-width="1.5">
    <path d="M173 107L317 53L448 114L600 43L738 102L902 55L1064 116"/>
    <path d="M238 135L360 89L516 140L678 88L808 132L979 90L1124 129"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="173" cy="107" r="4" fill="#67E8F9"/>
    <circle cx="317" cy="53" r="5" fill="#C4B5FD"/>
    <circle cx="448" cy="114" r="4" fill="#67E8F9"/>
    <circle cx="600" cy="43" r="5" fill="#E9D5FF"/>
    <circle cx="738" cy="102" r="4" fill="#67E8F9"/>
    <circle cx="902" cy="55" r="5" fill="#C4B5FD"/>
    <circle cx="1064" cy="116" r="4" fill="#67E8F9"/>
    <circle cx="238" cy="135" r="3" fill="#A78BFA"/>
    <circle cx="516" cy="140" r="3" fill="#A78BFA"/>
    <circle cx="808" cy="132" r="3" fill="#A78BFA"/>
    <circle cx="1124" cy="129" r="3" fill="#A78BFA"/>
  </g>
  <g fill="#A5B4FC" fill-opacity=".52" font-family="monospace" font-size="13" font-weight="700">
    <text x="50" y="37">01001000</text>
    <text x="87" y="148">0x2F</text>
    <text x="209" y="29">{ }</text>
    <text x="385" y="158">&lt;/&gt;</text>
    <text x="495" y="28">01101110</text>
    <text x="662" y="151">[ ]</text>
    <text x="796" y="30">0x7A</text>
    <text x="1033" y="38">00101</text>
