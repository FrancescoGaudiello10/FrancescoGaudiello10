  <circle cx="1080" cy="171" r="207" fill="#7C3AED" fill-opacity=".11"/>
  <circle cx="1234" cy="342" r="154" fill="#06B6D4" fill-opacity=".08"/>
  <path d="M751 202H1260" stroke="url(#beam)" stroke-width="2" filter="url(#glow)"/>

