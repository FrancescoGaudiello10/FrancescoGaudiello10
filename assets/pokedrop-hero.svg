<svg width="1280" height="390" viewBox="0 0 1280 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Francesco Gaudiello and PokeDropAlert</title>
  <desc id="description">An original purple spectral alert mascot in a collector intelligence lab.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset=".56" stop-color="#1D1740"/>
      <stop offset="1" stop-color="#102B3D"/>
    </linearGradient>
    <linearGradient id="spectral" x1="914" y1="87" x2="1149" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8B4FE"/>
      <stop offset=".43" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="beam" x1="830" y1="202" x2="1213" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse">
      <path d="M31 0H0V31" stroke="#A78BFA" stroke-opacity=".1"/>
    </pattern>
  </defs>

